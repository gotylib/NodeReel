services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nodereel
      POSTGRES_PASSWORD: nodereel
      POSTGRES_DB: nodereel
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodereel -d nodereel"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Some MinIO tags ship without curl; compose still starts api after minio-init.

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/nodereel || true;
      exit 0;
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nodereel;Username=nodereel;Password=nodereel
      Minio__Endpoint: minio:9000
      Minio__AccessKey: minioadmin
      Minio__SecretKey: minioadmin
      Minio__Bucket: nodereel
      Minio__UseSsl: "false"
      Ffmpeg__BinaryPath: ffmpeg
      Auth__JwtKey: NodeReel-docker-secret-change-me-please-32+
      Auth__JwtIssuer: NodeReel
      Auth__JwtAudience: NodeReel
      Auth__TokenLifetimeHours: "72"
      Auth__AdminUsername: admin
      Auth__AdminPassword: admin123
    ports:
      - "5057:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
